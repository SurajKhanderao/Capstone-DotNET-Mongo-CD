apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-noteapp
  namespace: webapps

spec:
  replicas: 1

  selector:
    matchLabels:
      app: dotnet-noteapp

  template:
    metadata:
      labels:
        app: dotnet-noteapp

    spec:
      containers:
        - name: dotnet-noteapp
          image: surajkhanderao/noteapp:latest
          ports:
            - containerPort: 5050

          env:
            - name: DOTNET_ENVIRONMENT
              value: Development

            - name: MongoDB__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MongoDB__ConnectionString

          resources:
            requests:
              cpu: "300m"
              memory: "250Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-noteapp
  namespace: webapps
spec:
  selector:
    app: dotnet-noteapp
  ports:
    - port: 80
      targetPort: 5050
  type: ClusterIP
