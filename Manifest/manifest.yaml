apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-noteapp
  namespace: webapps

spec:
  replicas: 1

  selector:
    matchLabels:
      app: dotnet-noteapp

  template:
    metadata:
      labels:
        app: dotnet-noteapp

    spec:
      containers:
        - name: dotnet-noteapp
          image: surajkhanderao/noteapp:v24
          ports:
            - containerPort: 5050

          env:
            - name: DOTNET_ENVIRONMENT
              value: Development

            - name: MongoDB__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongodb__connectionstring

          resources:
            requests:
              cpu: "300m"
              memory: "250Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 5050
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 5050
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-noteapp
  namespace: webapps
spec:
  selector:
    app: dotnet-noteapp
  ports:
    - port: 80
      targetPort: 5050
  type: ClusterIP
