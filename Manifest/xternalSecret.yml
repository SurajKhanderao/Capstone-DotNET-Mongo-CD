apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bankapp-external-secret
  namespace: webapps

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore

  target:
    name: mongodb-secret
    creationPolicy: Owner

  data:
    - secretKey: MongoDB__ConnectionString
      remoteRef:
        key: noteapp/mongodb
        property: mongodb__connectionstring
